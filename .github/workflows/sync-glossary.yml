name: Sync Glossary

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync glossary from Crowdin
        env:
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
          CROWDIN_BASE_URL: https://poizonglobal.crowdin.com/api/v2
        run: |
          python scripts/glossary_client.py cache-multi 4,6,25 glossary_cache.md

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet glossary_cache.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add glossary_cache.md
          git commit -m "chore: sync glossary from Crowdin

          Automated daily sync of terminology from Crowdin glossaries."
          git push
